<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distro Hopper</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e1e5ef;
    --text: #1d2130;
    --muted: #666d80;
    --tile: rgba(0, 0, 0, .04);
    --accent: #4f6df5;
    --shadow: 0 10px 30px rgba(20, 30, 60, .12);
    --skeleton-a: #e6e9f2;
    --skeleton-b: #f4f6fb;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --border: #272b38;
      --text: #e6e8ee;
      --muted: #9aa1b2;
      --tile: rgba(255, 255, 255, .04);
      --accent: #6c8cff;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
      --skeleton-a: #202431;
      --skeleton-b: #2c3142;
    }
  }

  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, color-mix(in srgb, var(--accent) 18%, var(--bg)), var(--bg) 60%) fixed;
    color: var(--text);
    margin: 0;
    padding: 3rem 1rem;
    line-height: 1.6;
  }

  h1 {
    text-align: center;
    font-size: 2.5rem;
    letter-spacing: -0.03em;
    background: linear-gradient(90deg, var(--text), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  #controls { text-align: center; margin-bottom: 2rem; }

  button {
    padding: .75rem 1.75rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 40%, transparent);
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 55%, transparent); }
  button:active { transform: translateY(0); }

  .box {
    max-width: 820px;
    margin: 0 auto 1.25rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    overflow: auto;
    box-shadow: var(--shadow);
    animation: fade-in .4s ease both;
  }
  .box img { max-width: 100%; }

  #screenshot { padding: 0; text-align: center; }
  #screenshot img { display: block; width: 100%; border-radius: var(--radius); }

  #container { min-height: 120px; }
  #container h2 { margin: 0 0 .75rem; font-size: 1.6rem; }
  #container ul {
    list-style: none; padding: 0; margin: 0 0 1rem;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .5rem;
  }
  #container li { background: var(--tile); border-radius: 10px; padding: .5rem .75rem; }
  #container li b {
    display: block; color: var(--muted); font-size: .75rem;
    text-transform: uppercase; letter-spacing: .06em;
  }

  #review {
    max-height: 40vh;
    border-left: 4px solid var(--accent);
    font-style: italic;
    color: var(--muted);
  }

  .error { color: #ff6b81; }

  /* Skeleton shimmer shown while a box is loading */
  .loading {
    color: transparent;
    min-height: 120px;
    background: linear-gradient(90deg, var(--skeleton-a) 25%, var(--skeleton-b) 50%, var(--skeleton-a) 75%) 0 0 / 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }

  @keyframes shimmer { to { background-position: -200% 0; } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<!-- The placeholder values for the distro screenshot and review will be replaced dynamically -->
<h1>Distro Hopper</h1>
<div id="controls"><button id="go">Random distro</button></div>
<div id="screenshot" class="box loading">Loading…</div>
<div id="container" class="box loading">Loading…</div>
<div id="review" class="box loading">Loading…</div>

<script>
const BASE = 'https://distrowatch.com/';
const TARGET = 'random.php';

// All requests go through our own Netlify Function, which fetches distrowatch.com
// server-side (no CORS problem) and caches reviews and images.
function proxyUrl(path) {
  return '/.netlify/functions/dw?path=' + encodeURIComponent(path);
}

// Turns any distrowatch image address (relative or absolute) into a proxied, cacheable one
function imageUrl(address) {
  return proxyUrl(new URL(address, BASE).href.replace(BASE, ''));
}

async function getHtml(path) {
  const response = await fetch(proxyUrl(path));
  if (!response.ok) {
    throw new Error('HTTP ' + response.status);
  }
  return await response.text();
}

// Removes potentially unsafe elements and attributes from the document
function sanitize(doc) {
  doc.querySelectorAll('script, style, iframe, link, meta, form').forEach(n => n.remove());
  // Replace each link with its text so no link locations remain
  doc.querySelectorAll('a').forEach(a => a.replaceWith(...a.childNodes));
  doc.querySelectorAll('[src]').forEach(e => e.setAttribute('src', imageUrl(e.getAttribute('src'))));
  doc.querySelectorAll('*').forEach(e => [...e.attributes].forEach(a => {
    if (/^on/i.test(a.name)) e.removeAttribute(a.name);
  }));
}

// Sets a message inside a container element, optionally with a CSS class for styling
function setMessage(box, text, cls) {
  const p = document.createElement('p');
  if (cls) p.className = cls;
  p.textContent = text;
  box.replaceChildren(p);
}

// Load a random review from all the availble reviews for the distro
async function loadReview(html, box) {
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    sanitize(doc);
    const bodies = [...doc.querySelectorAll('td[width="70%"]')].filter(td => td.textContent.trim());
    if (!bodies.length) return setMessage(box, 'No reviews for this distro.');
    const body = bodies[Math.floor(Math.random() * bodies.length)];
    const text = document.createElement('div');
    text.append(...body.cloneNode(true).childNodes);
    box.replaceChildren(text);
  } catch (e) {
    setMessage(box, 'Failed to load review: ' + e.message, 'error');
  }
}

// Main function to load the distro screenshot and review into the page
async function load() {
  const box = document.getElementById('container');
  const shot = document.getElementById('screenshot');
  const rev = document.getElementById('review');
  box.textContent = 'Loading…';
  shot.textContent = 'Loading…';
  rev.textContent = 'Loading…';
  try {
    const html = await getHtml(TARGET);
    const distroId = (html.match(/gallery\.php\?distribution=([\w.-]+)/) || html.match(/distribution=([\w.-]+)/) || [])[1];
    const doc = new DOMParser().parseFromString(html, 'text/html');

    // Read the screenshot addresses before sanitize() strips links and rewrites image sources
    const shotLink = doc.querySelector('a[href*="images/slinks/"]');
    const thumb = doc.querySelector('img[src*="images/slinks/"]');
    const fullSizeUrl = shotLink && imageUrl(shotLink.getAttribute('href'));
    const thumbUrl = thumb && imageUrl(thumb.getAttribute('src'));
    sanitize(doc);

    if (thumbUrl || fullSizeUrl) {
      const pic = document.createElement('img');
      pic.src = fullSizeUrl || thumbUrl;
      pic.alt = 'Screenshot';
      pic.onerror = () => { pic.onerror = null; if (thumbUrl) pic.src = thumbUrl; };
      shot.replaceChildren(pic);
    } else {
      setMessage(shot, 'No screenshot available.');
    }

    if (distroId) {
      getHtml('dwres.php?resource=ratings&distro=' + distroId)
        .then(h => loadReview(h, rev))
        .catch(e => setMessage(rev, 'Failed to load review: ' + e.message, 'error'));
    } else {
      setMessage(rev, 'No reviews for this distro.');
    }

    const h1 = doc.querySelector('td.TablesTitle h1') || doc.querySelector('h1');
    const ul = h1 && h1.parentElement.querySelector('ul');
    if (!h1 || !ul) throw new Error('Unexpected page layout');
    ul.querySelectorAll('li').forEach(li => {
      const label = li.querySelector('b')?.textContent.trim();
      if (label === 'Category:' || label === 'Popularity:') li.remove();
    });
    // Description is the loose content after the feature list, up to the first <br>
    const desc = document.createElement('p');
    for (let n = ul.nextSibling; n && n.nodeName !== 'BR'; n = n.nextSibling) {
      desc.append(n.cloneNode(true));
    }
    const title = document.createElement('h2');
    title.textContent = h1.textContent;
    box.replaceChildren(title, ul, desc);
  } catch (e) {
    setMessage(box, 'Failed to load: ' + e.message, 'error');
    setMessage(document.getElementById('screenshot'), '');
    setMessage(document.getElementById('review'), '');
  }
}

// Show the shimmer skeleton whenever a box contains only the "Loading…" placeholder
const loadingWatcher = new MutationObserver(records => {
  records.forEach(r => r.target.classList.toggle('loading', r.target.textContent === 'Loading…'));
});
document.querySelectorAll('.box').forEach(b => loadingWatcher.observe(b, { childList: true }));

document.getElementById('go').addEventListener('click', load);
load();
</script>
</body>
</html>
